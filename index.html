<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b141a" />
<meta name="description" content="Catat keuangan lewat chat, data tersimpan lokal di perangkat." />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Stacker" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<title>Stacker</title>
</head>
<body>
<div class="app">
  <header>
    <div class="top">
      <div>
        <div class="name">Stacker</div>
        <div class="sub" id="sub">catat keuangan lewat chat</div>
      </div>
      <div class="saldo" id="saldo">Saldo: -</div>
    </div>
    <div class="toolbar">
      <button id="export" title="Unduh backup JSON">⬇ Backup</button>
      <button id="import" title="Muat backup JSON">⬆ Restore</button>
      <button id="aikey" title="Atur AI (Gemini / OpenAI-compatible)">⚙ AI</button>
      <span id="busy" hidden>…</span>
    </div>
  </header>
  <div id="chat"></div>
  <footer>
    <input id="input" placeholder="makan siang 50rb..." autocomplete="off" />
    <button id="send">&#10148;</button>
  </footer>
  <input type="file" id="importFile" accept="application/json,.json" hidden />
</div>

<div id="aiModal" class="modal" hidden>
  <div class="modal-box">
    <h3>Pengaturan AI</h3>
    <label>Provider
      <select id="aiProvider">
        <option value="gemini">Gemini</option>
        <option value="openai">OpenAI-compatible (Ollama / Groq / dll)</option>
      </select>
    </label>
    <label>Base URL (hanya OpenAI-compatible)
      <input id="aiBase" placeholder="http://localhost:11434/v1" />
    </label>
    <label>Model
      <input id="aiModel" placeholder="gemini-2.0-flash" />
    </label>
    <label>API key (kosong = nonaktif / Ollama tanpa key)
      <input id="aiKey" type="password" placeholder="..." />
    </label>
    <div class="modal-actions">
      <button id="aiCancel">Batal</button>
      <button id="aiSave">Simpan</button>
    </div>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
